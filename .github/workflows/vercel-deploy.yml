# CI + Vercel deployment.
#
# Pull requests   -> quality gates only (lint/typecheck). No auto-deploy.
# Push to main    -> quality gates only. No auto-deploy.
# Manual dispatch -> deploy (production from main, preview otherwise).
#
# Auto-deploy on push/PR is intentionally DISABLED to avoid burning the
# Vercel Hobby daily deployment quota. Deploys run only when triggered
# manually from the Actions tab ("Run workflow").
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN      Vercel personal token of the account that owns the project
#   VERCEL_ORG_ID     "orgId" (team/account scope id) of the Vercel project
#   VERCEL_PROJECT_ID "projectId" of the Vercel project
# The org/project ids come from `vercel link` (.vercel/project.json) or from
# the Vercel dashboard (Project Settings > General).
#
# NOTE: the app is built exactly once per deployment, by `vercel build`;
# the artifact in .vercel/output is then uploaded with `--prebuilt`.

name: Vercel Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede stale runs on PRs/branches; never cancel an in-flight
# production deployment on main.
concurrency:
  group: vercel-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: 22
  VERCEL_CLI: vercel@50

jobs:
  quality:
    name: Lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  deploy-preview:
    name: Deploy preview
    needs: quality
    # Manual dispatch only, from a non-main branch. Auto-deploy on PRs is
    # disabled to preserve the Vercel deploy quota.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Check Vercel credentials are configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not configured"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel environment (preview)
        run: npx ${{ env.VERCEL_CLI }} pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel)
        run: npx ${{ env.VERCEL_CLI }} build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        id: deploy
        run: |
          url=$(npx ${{ env.VERCEL_CLI }} deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy production
    needs: quality
    # Production only from main, and only on manual dispatch (no auto-deploy
    # on push, to preserve the Vercel deploy quota).
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Check Vercel credentials are configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not configured"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel environment (production)
        run: npx ${{ env.VERCEL_CLI }} pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (Vercel, production)
        run: npx ${{ env.VERCEL_CLI }} build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        id: deploy
        run: |
          url=$(npx ${{ env.VERCEL_CLI }} deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
